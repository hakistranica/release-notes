<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      body { margin: 0; background: #fbf7f2; color: #2a2230; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
      h1, h2 { line-height: 1.25; }
      h2 { margin-top: 2em; color: #5a2d82; }
      a { color: #c2410c; }
      img { max-width: 100%; height: auto; border-radius: 8px; vertical-align: top; margin: 4px 4px 4px 0; }
    </style>
  </head>
  <body>
    <main>
{{ content }}
    </main>
  </body>
</html>
